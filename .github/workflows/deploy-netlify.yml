name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Netlify configuration
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=0
          for name in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: $name"
              echo "- Missing required repository secret: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Netlify deployment blocked; no site was deployed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.0"
          extended: true

      - name: Build
        run: cd site && hugo --minify --baseURL https://content-empire-tdsquad.netlify.app/

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: "./docs"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
