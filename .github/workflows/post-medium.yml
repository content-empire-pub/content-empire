name: Post to Medium

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 10:00 UTC
    - cron: "0 10 * * 1"

permissions:
  contents: write

jobs:
  post-to-medium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Post articles to Medium
        env:
          MEDIUM_SESSION_COOKIE: ${{ secrets.MEDIUM_SESSION_COOKIE }}
          MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
        run: python scripts/post-to-medium.py --export-html

      - name: Upload HTML drafts as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medium-drafts-html
          path: medium-drafts-html/
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist posted-article tracking
        if: always()
        run: |
          if git diff --quiet -- scripts/medium-posted.json; then
            echo "No new Medium drafts to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/medium-posted.json
          git commit -m "chore: record Medium drafts posted by scheduled run"
          git push
